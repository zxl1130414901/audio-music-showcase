_synth_noteon 等 API 把合成器塞进自研程序或游戏引擎",strength:"核心能力"},{type:"SoundFont 试听",exampleZh:"用 -g 调增益、-o synth.reverb.active=0 关混响来对比音色库",strength:"辅助能力"}],useCases:[{scenarioZh:"MIDI 批量烘音",whoZh:"编曲/素材制作",whyZh:"-F 不需声卡，服务器或本机都能批量把 .mid 转成 wav",deliverableZh:"wav/mp3 成品",fit:"适合"},{scenarioZh:"游戏/工具内嵌合成",whoZh:"C/C++ 开发者",whyZh:"LGPL 库、API 稳定、体积小，可直接链接进引擎",deliverableZh:"带合成功能的程序",fit:"适合"},{scenarioZh:"老 MIDI 工程复活",whoZh:"怀旧音乐爱好者",whyZh:"自带 AWE 音色，与 90 年代 MIDI 的音色映射接近",deliverableZh:"还原版录音",fit:"适合"},{scenarioZh:"现代配乐制作",whoZh:"影视/游戏配乐",whyZh:"音质取决于 SF2，自带音色采样旧、无多采样层与 round-robin",deliverableZh:"分轨",fit:"勉强"}],featureCallouts:[{titleZh:"离线快渲",descZh:"-F 直接写文件，无需声卡"},{titleZh:"复音 256",descZh:"复音默认 256，上限 65535"},{titleZh:"采样率可调",descZh:"8000–96000 Hz，默认 44100"},{titleZh:"多驱动支持",descZh:"ALSA/WASAPI/JACK 等五套驱动"},{titleZh:"自带音色",descZh:"自带 sf2/sf3/dls 样例音源"}],ceilingsZh:"参数上限来自 fluid_synth.c 注册的 settings：synth.polyphony 默认 256、范围 1–65535；synth.sample-rate 默认 44100、范围 8000–96000；synth.audio-channels 默认 1 组（范围 1–128），即默认一对立体声，要 5.1 得自己加组。音色不生成，全部来自 SF2/SF3/DLS 采样，采样位深与循环点由音源文件决定，仓库自带的 sf2 版 VintageDreamsWaves-v2 只有 314 KB。命令行 -F 是整段渲染，长曲目一次写完，不分段也不流式；位深默认 16 bit，可选 s24/s32/float。",workflowZh:"四步：CMake + MSVC 构建 → 装/放 SF2 音源 → fluidsynth -F 渲染 MIDI → ffmpeg 转码验收",workflow:[{stepZh:"构建",detailZh:"装 VS 生成工具与 CMake 后 cmake -Bbuild 再 cmake --build build --config Release；或 scoop/choco 装预编译包",effortZh:"20–45 分钟"},{stepZh:"备音源",detailZh:"直接用仓库 sf2/VintageDreamsWaves-v2.sf2，或换自己的 SF2",effortZh:"1 分钟"},{stepZh:"渲染",detailZh:"fluidsynth -F out.wav -r 44100 -g 1.0 sf2/VintageDreamsWaves-v2.sf2 input.mid",effortZh:"秒级到分钟级，取决于曲长"},{stepZh:"验收转码",detailZh:"ffprobe 看采样率/声道，verify_audio.ps1 查静音，再 ffmpeg 转 mp3",effortZh:"1–2 分钟"}],compareTips:[{vs:"schellingb__TinySoundFont",whenZh:"只要几 KB 的嵌入式 SF2 播放库选 TinySoundFont；需要 CLI、多种音频驱动与效果器选 FluidSynth",adviceZh:"只要几 KB 的嵌入式 SF2 播放库选 TinySoundFont；需要 CLI、多种音频驱动与效果器选 FluidSynth"},{vs:"surge-synthesizer__surge",whenZh:"要算法合成、调制矩阵与大量音色选 Surge XT；只要按 MID
